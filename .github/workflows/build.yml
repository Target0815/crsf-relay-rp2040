# Baut die Firmware bei jedem Push / Pull-Request und führt die Host-Tests aus.
# Bei einem Tag "v*" (z. B. v1.0.5) bzw. einem auf GitHub veröffentlichten Release
# wird die UF2-Datei an das Release angehängt.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build build-essential python3

      - name: Pico SDK 2.1.1 aus dem Cache
        id: sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.1.1-v1

      - name: Pico SDK 2.1.1 holen
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Host-Tests (Protokolllogik)
        run: |
          g++ -std=c++17 -Wall -Wextra -Wno-invalid-offsetof -fsanitize=address,undefined \
            -Isrc test/test_core.cpp src/core.cpp -o test/test_core
          ./test/test_core

      - name: Firmware bauen
        run: |
          export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
          ./build_all.sh

      - name: PIO-Simulation (Halbduplex)
        run: python3 test/pio_sim.py build/rp2040-zero/hd_uart.pio.h

      - name: UF2 hochladen
        uses: actions/upload-artifact@v4
        with:
          name: crsf-relay-uf2
          path: dist/*.uf2
          if-no-files-found: error

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
